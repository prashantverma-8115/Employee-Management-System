
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        p { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        button, a {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 12px;
            border: 0;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        button { background: #16785f; color: white; }
        a { background: #e5e7eb; color: #222; }
        .errors { color: #b91c1c; }
    </style>
</head>
<body>
<div class="container">
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="errors">{{ form.non_field_errors }}</div>
        {% endif %}

        {% for field in form %}
            <p>
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                {{ field }}

                {% if field.help_text %}
                    <small>{{ field.help_text }}</small>
                {% endif %}

                {% if field.errors %}
                    <div class="errors">{{ field.errors }}</div>
                {% endif %}
            </p>
        {% endfor %}

        <button type="submit">Save Employee</button>
        <a href="{% url 'employees:employee_list' %}">Cancel</a>
    </form>
</div>
</body>
</html>
