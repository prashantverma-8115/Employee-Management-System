<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Department Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 30px;
            color: #1f2937;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        a, button {
            display: inline-block;
            padding: 9px 13px;
            margin: 4px;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .add {
            background: #16785f;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }
        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .delete {
            color: #b91c1c;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Department Management</h1>

    <a href="{% url 'employees:dashboard' %}">Dashboard</a>

    <a class="add" href="{% url 'employees:department_create' %}">
        + Add Department
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Department Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for department in departments %}
            <tr>
                <td>{{ department.id }}</td>
                <td>{{ department.name }}</td>
                <td>{{ department.description|default:"-" }}</td>
                <td>
                    <a href="{% url 'employees:department_update' department.pk %}">
                        Edit
                    </a>
                    <a class="delete"
                       href="{% url 'employees:department_delete' department.pk %}">
                        Delete
                    </a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4">No departments added yet.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
