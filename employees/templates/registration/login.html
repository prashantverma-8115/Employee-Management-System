<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Employee Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 40px 15px;
        }
        .login-box {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 10px 18px;
            background: #16785f;
            color: white;
            border: 0;
            cursor: pointer;
        }
        li { color: #b91c1c; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>Employee Login</h1>

    {% if form.errors %}
        <p>Username ya password sahi nahi hai.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
        </p>

        <p>
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
        </p>

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
